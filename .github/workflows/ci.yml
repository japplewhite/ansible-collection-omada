name: CI

on:
  push:
    branches: [main]
    paths:
      - "ansible_collections/applewhiteit/omada/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "ansible_collections/applewhiteit/omada/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: ansible_collections/applewhiteit/omada

jobs:
  lint:
    name: Lint (ruff, ansible-lint)
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false - actions/checkout otherwise persists its
      # own repo-scoped GITHUB_TOKEN as a *global* git credential for the
      # whole job (via GIT_CONFIG_* env vars), which collides with the
      # FORK_ACCESS_TOKEN credential configured below for the private fork -
      # both match the "https://github.com/" prefix, so git/GitHub see a
      # conflicting auth header and reject it ("Invalid username or token").
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # requirements.txt currently pins a private fork
      # (japplewhite/tplink-omada-api-fork) for unreleased VLAN/network
      # support - see requirements.txt's own comment for why. That repo is
      # private, so this step needs a token with read access to it, since
      # the default GITHUB_TOKEN only covers this repo. Set a repo secret
      # named FORK_ACCESS_TOKEN (a PAT, or fine-grained token scoped to
      # read tplink-omada-api-fork) at:
      # https://github.com/japplewhite/ansible-collection-omada/settings/secrets/actions
      # Until that secret exists, this step (and the whole workflow) will
      # fail on the private git+https:// URL - that's expected, not a bug.
      - name: Install tooling
        env:
          FORK_ACCESS_TOKEN: ${{ secrets.FORK_ACCESS_TOKEN }}
        run: |
          if [ -n "$FORK_ACCESS_TOKEN" ]; then
            git config --global url."https://x-access-token:${FORK_ACCESS_TOKEN}@github.com/japplewhite/tplink-omada-api-fork.git".insteadOf "https://github.com/japplewhite/tplink-omada-api-fork.git"
          fi
          pip install ruff ansible-lint ansible-core
          pip install -r requirements.txt

      - name: ruff check
        run: ruff check .

      - name: ansible-lint
        run: ansible-lint .

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false - actions/checkout otherwise persists its
      # own repo-scoped GITHUB_TOKEN as a *global* git credential for the
      # whole job (via GIT_CONFIG_* env vars), which collides with the
      # FORK_ACCESS_TOKEN credential configured below for the private fork -
      # both match the "https://github.com/" prefix, so git/GitHub see a
      # conflicting auth header and reject it ("Invalid username or token").
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # See the lint job's comment above re: FORK_ACCESS_TOKEN.
      - name: Install tooling
        env:
          FORK_ACCESS_TOKEN: ${{ secrets.FORK_ACCESS_TOKEN }}
        run: |
          if [ -n "$FORK_ACCESS_TOKEN" ]; then
            git config --global url."https://x-access-token:${FORK_ACCESS_TOKEN}@github.com/japplewhite/tplink-omada-api-fork.git".insteadOf "https://github.com/japplewhite/tplink-omada-api-fork.git"
          fi
          pip install ansible-core pytest pytest-mock
          pip install -r requirements.txt

      - name: pytest
        run: pytest tests/unit -v
